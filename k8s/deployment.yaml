apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-vibes-deployment
  namespace: dev-vibes
  labels:
    app: dev-vibes
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dev-vibes
  template:
    metadata:
      labels:
        app: dev-vibes
        tier: frontend
    spec:
      containers:
        - name: dev-vibes
          image: dev-vibes:latest # Replace with your container registry image (e.g. docker.io/username/dev-vibes:latest)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          envFrom:
            - configMapRef:
                name: dev-vibes-config
