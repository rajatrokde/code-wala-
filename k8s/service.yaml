apiVersion: v1
kind: Service
metadata:
  name: dev-vibes-service
  namespace: dev-vibes
  labels:
    app: dev-vibes
spec:
  type: ClusterIP # Use NodePort or LoadBalancer for direct cloud access without Ingress
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: dev-vibes
